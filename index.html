<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分散学習クイズアプリ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
<div id="app">
    <section id="dashboard-view" class="view active card" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">学習ダッシュボード</h1>

        <div class="stats" aria-label="学習状況">
            <div><strong>着手率:</strong> <span id="stat-attempted">0</span>%</div>
            <div><strong>新規・復習:</strong> <span id="stat-due">0</span>問</div>
            <div class="text-danger"><strong>要注意:</strong> <span id="stat-wrong">0</span>問</div>
        </div>

        <button type="button" class="btn-primary" data-action="start-normal">今日の学習を始める</button>
        <button type="button" class="btn-danger" data-action="start-wrong">間違えた問題を復習する</button>

        <div class="import-section">
            <p class="import-description">問題データ（CSV）の追加・更新</p>
            <label for="csv-upload" class="btn-secondary">CSVファイルを選択</label>
            <input type="file" id="csv-upload" accept=".csv" class="visually-hidden">
        </div>
    </section>

    <section id="quiz-view" class="view card" aria-labelledby="quiz-title">
        <h2 id="quiz-title">問題</h2>
        <p id="question-text" class="question-text"></p>
        <img id="question-image" class="content-image hidden" src="" alt="問題画像">
        <div id="options-container" class="options-container"></div>
    </section>

    <section id="result-view" class="view card" aria-labelledby="result-title">
        <h2 id="result-title"></h2>

        <div class="result-question-box">
            <span class="result-question-label">問題：</span>
            <p id="result-question-text" class="result-question-text"></p>
        </div>

        <p id="explanation-text" class="explanation-box"></p>
        <img id="explanation-image" class="content-image hidden" src="" alt="解説画像">

        <div id="correct-actions" class="hidden">
            <p class="evaluation-title">この問題はどうでしたか？（次回出題日を決定）</p>
            <div class="sm2-buttons">
                <button type="button" class="btn-eval eval-hard" data-quality="3">難しかった<br><small id="btn-interval-3"></small></button>
                <button type="button" class="btn-eval eval-good" data-quality="4">普通<br><small id="btn-interval-4"></small></button>
                <button type="button" class="btn-eval eval-easy" data-quality="5">簡単<br><small id="btn-interval-5"></small></button>
            </div>
        </div>

        <div id="wrong-actions" class="wrong-actions hidden">
            <p class="evaluation-title text-danger">※この問題は「要注意（間違えた問題）リスト」に追加されます</p>
            <button type="button" class="btn-danger" data-quality="0">解説を読んで、次へ進む</button>
        </div>
    </section>
</div>
</body>
</html>
